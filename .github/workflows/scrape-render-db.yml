# Writes to Render Postgres (LinkedIn skipped: --source hh).
# Required secret: RENDER_DATABASE_URL (Postgres → Connect → External Database URL).
# Optional: RENDER_DJANGO_SECRET_KEY — if unset, DEBUG=development dev SECRET_KEY is used for this job only.

name: Scrape HH → Render DB

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "HH pages per run"
        type: string
        default: "5"
  schedule:
    - cron: "0 6 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Require RENDER_DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add repository secret RENDER_DATABASE_URL (Render Postgres External URL)"
            exit 1
          fi
      - name: scrape_all (HH only)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
          DATABASE_SSL_REQUIRE: "true"
          SECRET_KEY: ${{ secrets.RENDER_DJANGO_SECRET_KEY }}
          DEBUG: "True"
          DJANGO_ENV: "development"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DJANGO_LOG_DIR: ${{ github.workspace }}/logs
          PAGES: ${{ github.event.inputs.pages || '5' }}
        run: python manage.py scrape_all --source hh --pages "${PAGES}"
