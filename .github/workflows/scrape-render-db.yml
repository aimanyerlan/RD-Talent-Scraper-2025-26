# Writes to Render Postgres (same DB as production). LinkedIn is skipped (--source hh).
# Secrets: Settings → Secrets and variables → Actions:
#   RENDER_DATABASE_URL — Postgres → Connect → External Database URL
#   RENDER_DJANGO_SECRET_KEY — any random string 50+ characters

name: Scrape HH → Render DB

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "HH pages per run"
        type: string
        default: "5"
  schedule:
    - cron: "0 6 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: scrape_all (HH only)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
          DATABASE_SSL_REQUIRE: "true"
          SECRET_KEY: ${{ secrets.RENDER_DJANGO_SECRET_KEY }}
          DEBUG: "False"
          DJANGO_ENV: production
          ALLOWED_HOSTS: localhost,127.0.0.1
          PAGES: ${{ github.event.inputs.pages || '5' }}
        run: python manage.py scrape_all --source hh --pages "${PAGES}"
