name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend-lint:
    name: Backend (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: flake8 backend

  backend-test:
    name: Backend (migrate + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: talent_user
          POSTGRES_PASSWORD: talent_password
          POSTGRES_DB: talent_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talent_user -d talent_db_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: talent_user
      POSTGRES_PASSWORD: talent_password
      POSTGRES_DB: talent_db_test
      SECRET_KEY: ci-not-for-production-secret-key-min-50-chars-xxxxxxxxxx
      DEBUG: "False"
      ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt coverage
      - run: python manage.py migrate --no-input
        working-directory: backend
      - run: coverage run --source=apps manage.py test --no-input -v 2
        working-directory: backend
      - name: Coverage report
        working-directory: backend
        run: coverage report -m

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker-image:
    name: Docker (API image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: rd-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (SSH, optional)
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend, docker-image]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Remote update & Docker Compose
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GIT_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_USER}" ] || [ -z "${DEPLOY_SSH_KEY}" ] || [ -z "${DEPLOY_PATH}" ]; then
            echo "::notice::Deploy skipped — set secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH."
            exit 0
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/ci_deploy_key
          chmod 600 ~/.ssh/ci_deploy_key
          printf '%s\n' \
            "set -e" \
            "cd $(printf %q "$DEPLOY_PATH")" \
            "git fetch origin $(printf %q "$GIT_BRANCH")" \
            "git reset --hard $(printf %q "origin/${GIT_BRANCH}")" \
            "docker compose -f docker-compose.yml -f docker-compose.prod.yml pull || true" \
            "docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build" \
            | ssh -i ~/.ssh/ci_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
                "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s
          rm -f ~/.ssh/ci_deploy_key
