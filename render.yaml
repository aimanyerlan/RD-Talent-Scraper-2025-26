# Render Blueprint — same Dockerfile as local/production Compose; docker-compose.yml unchanged.
# Docs: https://render.com/docs/blueprint-spec
#
# After first deploy, set optional secrets in the Dashboard (GEMINI_API_KEY, GOOGLE_OAUTH_CLIENT_ID, …).
# Free Postgres expires in 30 days; upgrade or export data for real use.
# Background workers are not on Render’s free tier — Celery runs in-process (CELERY_TASK_ALWAYS_EAGER).
#
# Cron (HH scrape → same Render Postgres): requires a paid instance type (not `free`); minimum ~$1/mo per Render docs.
# Dashboard → cron job → “Trigger Run” for a one-off test. Free alternative: `.github/workflows/scrape-render-db.yml`.

services:
  - type: web
    name: rd-talent-api
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: rd-talent-api.onrender.com
      - key: USE_X_FORWARDED_HOST
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SECURE
        value: "true"
      - key: JWT_AUTH_SECURE
        value: "true"
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: rd-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: rd-talent-redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://rd-talent-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://rd-talent-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://rd-talent-web.onrender.com,https://rd-talent-api.onrender.com
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: rd-talent-web
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://rd-talent-api.onrender.com/api

  - type: keyvalue
    name: rd-talent-redis
    region: frankfurt
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: required-for-free-keyvalue

  - type: cron
    name: rd-talent-scrape-hh
    runtime: docker
    region: frankfurt
    plan: starter
    branch: main
    schedule: "0 6 * * *"
    dockerCommand: sh /app/deploy/docker/scrape_cron.sh
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: rd-talent-api.onrender.com,localhost,127.0.0.1
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: rd-postgres
          property: connectionString
      - key: SKIP_DJANGO_MIGRATE
        value: "1"
      - key: SCRAPE_HH_PAGES
        value: "5"

databases:
  - name: rd-postgres
    region: frankfurt
    databaseName: talent_db
    plan: free
